<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript DOM Manipulation</title>
    <style>
        body{
            color: aliceblue;
            background-color: grey;
            text-align: center;
        }
        .dynamic-style {
            color: rgb(27, 27, 36);
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h1>Welcome to Dynamic DOM Manipulation</h1>
    <p id="dynamic-text">Education is better than silver and gold.</p>

    <div id="extra-element" style="display: none;">Money is not success!</div>
    <script src="script.js"></script>
</body>
</html>
